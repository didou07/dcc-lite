name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after all checks pass
        type: boolean
        required: false
        default: false

concurrency:
  group: dcc-lite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      exists: ${{ steps.meta.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Install GTK and WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Validate release version
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION (v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; raise VERSION to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l $(find src -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "$files"
            echo "Run gofmt on the listed files." >&2
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags native ./src/dcclite ./src/vlc

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src/web -type f -name '*.js' ! -path 'src/web/vendor/*' -print0)

      - name: Build all release packages
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash build.sh all

      - name: Validate packages and native version
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          count=0
          for file in dist/*.zip; do
            [[ -f "$file" ]] || { echo "No release archives found" >&2; exit 1; }
            [[ "$file" == *-bundle.zip ]] && continue
            entries="$(unzip -Z1 "$file")"
            [[ "$(printf '%s\n' "$entries" | wc -l | tr -d ' ')" == "2" ]] && printf '%s\n' "$entries" | grep -qx 'README.txt' || { echo "$file must contain the program and README.txt" >&2; exit 1; }
            count=$((count + 1))
          done
          [[ "$count" -eq 3 ]] || { echo "Expected 3 platform archives, found $count" >&2; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -p "dist/DCC-Lite-${VERSION}-linux-amd64.zip" DCCLite > "$tmp/DCCLite"
          chmod +x "$tmp/DCCLite"
          "$tmp/DCCLite" --version | grep -F "DCC Lite ${VERSION} (linux/amd64)"

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DCC-Lite-release-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    # GTK needs cgo, so arm64 is built natively on an arm64 runner.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Install GTK and WebKitGTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Vet the Linux window build
        run: go vet -tags native ./src/dcclite ./src/vlc

      - name: Build the Linux arm64 package
        run: VERSION="$(tr -d '[:space:]' < VERSION)" bash build.sh

      - name: Validate the package and native version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          file="dist/DCC-Lite-${version}-linux-arm64.zip"
          [[ "$(unzip -Z1 "$file" | wc -l | tr -d ' ')" == "2" ]] && unzip -Z1 "$file" | grep -qx 'README.txt' || { echo "$file must contain the program and README.txt" >&2; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -p "$file" DCCLite > "$tmp/DCCLite"
          chmod +x "$tmp/DCCLite"
          "$tmp/DCCLite" --version | grep -F "DCC Lite ${version} (linux/arm64)"

      - name: Upload Linux arm64 package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DCC-Lite-linux-arm64-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  linux-32bit:
    # 386 and arm are cross built in a Debian container that has the 32-bit GTK libraries.
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install build tools and 32-bit libraries
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture i386
          dpkg --add-architecture armhf
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git zip unzip curl pkg-config gcc gcc-multilib gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
            libgtk-3-dev:i386 libwebkit2gtk-4.1-dev:i386 libgtk-3-dev:armhf libwebkit2gtk-4.1-dev:armhf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Build the Linux 386 and arm packages
        shell: bash
        run: VERSION="$(tr -d '[:space:]' < VERSION)" bash build.sh linuxgui/386 linuxgui/arm

      - name: Validate the packages and the 386 native version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          for cpu in 386 arm; do
            file="dist/DCC-Lite-${version}-linux-${cpu}.zip"
            [[ "$(unzip -Z1 "$file" | wc -l | tr -d ' ')" == "2" ]] && unzip -Z1 "$file" | grep -qx 'README.txt' || { echo "$file must contain the program and README.txt" >&2; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -p "dist/DCC-Lite-${version}-linux-386.zip" DCCLite > "$tmp/DCCLite"
          chmod +x "$tmp/DCCLite"
          "$tmp/DCCLite" --version | grep -F "DCC Lite ${version} (linux/386)"

      - name: Upload Linux 32-bit packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DCC-Lite-linux-32bit-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    # A macOS failure does not block the other packages.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Vet the macOS build
        run: go vet -tags native ./src/dcclite ./src/vlc

      - name: Build the macOS packages
        run: VERSION="$(tr -d '[:space:]' < VERSION)" bash build.sh mac

      - name: Validate the macOS packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          for cpu in arm64 amd64; do
            file="dist/DCC-Lite-${version}-darwin-${cpu}.zip"
            [[ "$(unzip -Z1 "$file" | sort | tr '\n' ' ')" == "DCCLite README.txt " ]] || { echo "$file must contain DCCLite and README.txt" >&2; exit 1; }
          done
          tmp="$(mktemp -d)"
          unzip -p "dist/DCC-Lite-${version}-darwin-arm64.zip" DCCLite > "$tmp/DCCLite"
          chmod +x "$tmp/DCCLite"
          "$tmp/DCCLite" --version | grep -F "DCC Lite ${version} (darwin/arm64)"

      - name: Upload macOS packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DCC-Lite-macos-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [build, linux-arm64, linux-32bit, macos]
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.linux-arm64.result == 'success' &&
      needs.linux-32bit.result == 'success' &&
      needs.build.outputs.exists != 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: DCC-Lite-release-packages
          path: dist/

      - name: Download Linux arm64 package
        uses: actions/download-artifact@v4
        with:
          name: DCC-Lite-linux-arm64-package
          path: dist/

      - name: Download Linux 32-bit packages
        uses: actions/download-artifact@v4
        with:
          name: DCC-Lite-linux-32bit-packages
          path: dist/

      - name: Download macOS packages (if they were built)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: DCC-Lite-macos-packages
          path: dist/

      - name: Write checksums for all packages
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published files." >&2
            exit 1
          fi
          count="$(find dist -maxdepth 1 -name '*.zip' ! -name '*-bundle.zip' | wc -l | tr -d ' ')"
          if [[ "$count" == "6" ]]; then echo "::warning::No macOS packages in this release (the macOS job did not produce them)."
          elif [[ "$count" != "8" ]]; then echo "Expected 6 or 8 release packages, found $count." >&2; exit 1; fi
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "DCC Lite $tag" --generate-notes "${flags[@]}"
