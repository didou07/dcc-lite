name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after all checks pass
        type: boolean
        required: false
        default: false

concurrency:
  group: dcc-lite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false

      - name: Validate release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION (v$version)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l $(find src -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            echo "$files"
            echo "Run gofmt on the listed files." >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find src/web -type f -name '*.js' ! -path 'src/web/vendor/*' -print0)

      - name: Build all release targets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash build.sh all

      - name: Validate packages and native version
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          count=0
          for file in dist/*.zip; do
            [[ -f "$file" ]] || { echo "No release archives found" >&2; exit 1; }
            entries="$(unzip -Z1 "$file")"
            [[ "$(printf '%s\n' "$entries" | wc -l | tr -d ' ')" == "1" ]] || { echo "$file must contain exactly one executable" >&2; exit 1; }
            count=$((count + 1))
          done
          [[ "$count" -eq 10 ]] || { echo "Expected 10 platform archives, found $count" >&2; exit 1; }
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          unzip -p "dist/DCC-Lite-${VERSION}-linux-amd64.zip" DCCLite > "$tmp/DCCLite"
          chmod +x "$tmp/DCCLite"
          "$tmp/DCCLite" --version | grep -F "DCC Lite ${VERSION} (linux/amd64)"

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: DCC-Lite-release-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: DCC-Lite-release-packages
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-test.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace published files." >&2
            exit 1
          fi
          [[ "$(find dist -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" == "10" ]] || { echo "Expected 10 release packages." >&2; exit 1; }
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "DCC Lite $tag" --generate-notes "${flags[@]}"
