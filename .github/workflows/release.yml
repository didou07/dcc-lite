name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read the version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "VERSION '$version' is not like 1.2.3" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; raise VERSION to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Go
        if: steps.v.outputs.exists != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: false
      - name: Install the Go toolchain patched for Windows 7
        if: steps.v.outputs.exists != 'true'
        run: echo "GO_WIN7=$(bash scripts/setup-go-win7.sh)" >> "$GITHUB_ENV"
      - name: Build all platforms
        if: steps.v.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}" bash scripts/build.sh
          ls dist/*-win7.zip   # the Windows 7 packages must exist
      - name: Publish GitHub release
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          flags=()
          [[ "$tag" == *-* ]] && flags+=(--prerelease)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "DCC Lite $tag" --generate-notes "${flags[@]}"
