<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in — DCC Lite</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
  <main class="login-card" aria-labelledby="loginTitle">
    <div class="brand"><span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l6-6-6-6M12 19h8"/></svg></span><span class="brand-name">DCC <b>Lite</b></span></div>
    <h1 id="loginTitle">Remote access</h1>
    <p class="muted">Enter the remote access password to manage your devices from this browser.</p>
    <form id="loginForm" autocomplete="on">
      <label class="field"><span>Password</span><input id="loginPassword" name="password" type="text" autocomplete="current-password" autocapitalize="off" autocorrect="off" required autofocus spellcheck="false"></label>
      <p class="form-error" id="loginError" role="alert" hidden></p>
      <button class="btn primary" id="loginSubmit" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
